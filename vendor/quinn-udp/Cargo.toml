# Vendored from quinn-udp 0.5.14.
# Windows no longer depends on the libc crate: c_int / c_uint come from std::ffi.
# Unix still uses libc for sendmsg / recvmmsg ancillary-data layouts.

[package]
name = "quinn-udp"
version = "0.5.14"
edition = "2021"
rust-version = "1.74.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/quinn-rs/quinn"
description = "UDP sockets with ECN information for the QUIC transport protocol"
keywords = ["quic"]
categories = ["network-programming", "asynchronous"]

[features]
default = ["tracing", "log"]
log = ["tracing/log"]
direct-log = ["dep:log"]
fast-apple-datapath = []

[dependencies]
log = { version = "0.4", optional = true }
tracing = { version = "0.1.10", features = ["std"], default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.158"

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
socket2 = ">=0.5, <0.7"

[target.'cfg(windows)'.dependencies]
once_cell = "1.19"
windows-sys = { version = ">=0.52, <=0.60", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_Networking_WinSock",
] }

[build-dependencies]
cfg_aliases = "0.2"

[lib]
name = "quinn_udp"
path = "src/lib.rs"
bench = false
