[package]
name = "web-transport"
description = "Generic WebTransport API with native (web-transport-quinn) and WASM (web-transport-wasm) support."
authors = ["Luke Curley"]
repository = "https://github.com/moq-dev/web-transport"
license = "MIT OR Apache-2.0"
version = "0.10.2"
edition = "2021"
keywords = ["quic", "http3", "webtransport"]
categories = ["network-programming", "web-programming"]

[dependencies]
bytes = "1"
thiserror = "2"
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# O3 pure: no ring/aws-lc/cc (Quinn rustls-pure + process CryptoProvider).
web-transport-quinn = { path = "../web-transport-quinn", default-features = false, features = ["pure"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-transport-wasm = "0.5.5"