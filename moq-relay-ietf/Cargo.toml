[package]
name = "moq-relay-ietf"
description = "Media over QUIC"
authors = ["moq-rs contributors"]
repository = "https://github.com/cloudflare/moq-rs"
license = "MIT OR Apache-2.0"

version = "0.7.25"
edition = "2021"

keywords = ["quic", "http3", "webtransport", "media", "live"]
categories = ["multimedia", "network-programming", "web-programming"]

[lib]
name = "moq_relay_ietf"
path = "src/lib.rs"

[[bin]]
name = "moq-relay-ietf"
path = "src/bin/moq-relay-ietf/main.rs"

[dependencies]
moq-transport = { path = "../moq-transport", version = "0.16" }
moq-native-ietf = { path = "../moq-native-ietf", version = "0.10" }
moq-api = { path = "../moq-api", version = "0.2" }
web-transport = { workspace = true }

url = "2"

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"

# Pure HTTPS fingerprint server (axum + tokio-rustls; no hyper-serve)
axum = { version = "0.7", features = ["tokio"] }
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors"] }
hex = "0.4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

fs2 = "0.4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = "2.0.17"

rustls-rustcrypto = { path = "../vendor/rustls-rustcrypto" }

metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[features]
default = []
metrics-prometheus = ["dep:metrics-exporter-prometheus"]
