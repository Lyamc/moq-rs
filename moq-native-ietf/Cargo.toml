#
# O3 pure-Rust patch: no ring / no cc. Windows does not use the libc crate.
# Uses rustls-rustcrypto + Quinn rustls-pure.

[package]
name = "moq-native-ietf"
description = "Media over QUIC - Helper library for native applications"
authors = ["Luke Curley"]
repository = "https://github.com/Lyamc/moq-rs"
license = "MIT OR Apache-2.0"

version = "0.10.0"
edition = "2021"

keywords = ["quic", "http3", "webtransport", "media", "live"]
categories = ["multimedia", "network-programming", "web-programming"]

[dependencies]
moq-transport = { path = "../moq-transport", version = "0.16" }
web-transport = { workspace = true }
web-transport-quinn = { path = "../vendor/web-transport-quinn", default-features = false, features = ["pure"] }

# Pure-Rust TLS (install CryptoProvider at process start)
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
rustls-pemfile = "2"
rustls-native-certs = "0.7"
rustls-rustcrypto = { path = "../vendor/rustls-rustcrypto" }
quinn = { path = "../vendor/quinn", default-features = false, features = ["runtime-tokio", "log", "qlog", "rustls-pure", "bloom", "platform-verifier"] }

# Fingerprints without ring
sha2 = "0.10"
hex = "0.4"
url = "2"
rand = "0.8"

tokio = { version = "1", features = ["full"] }
futures = "0.3"
socket2 = "0.5"

# no `backtrace` feature — that pulls `cc` via the backtrace crate
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = { workspace = true }
bytes = "1"
