# Pure-Rust workspace: default Windows build has no ring, no cc, and no libc crate.

[workspace]
members = [
	"moq-transport",
	"moq-relay-ietf",
	"moq-pub",
	"moq-sub",
	"moq-api",
	"moq-clock-ietf",
	"moq-native-ietf",
	"moq-catalog",
	"moq-test-client",
	"vendor/rustls-rustcrypto",
	"vendor/web-transport-quinn",
	"vendor/web-transport",
	"vendor/hyper-serve",
]
resolver = "2"

[workspace.dependencies]
web-transport = { path = "vendor/web-transport", version = "0.10.2" }
quinn = { git = "https://github.com/Lyamc/quinn", rev = "a201190d7b7a5de47168104f03066b608c91dc46", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
debug = true

[patch.crates-io]
web-transport = { path = "vendor/web-transport" }
rustls-rustcrypto = { path = "vendor/rustls-rustcrypto" }
web-transport-quinn = { path = "vendor/web-transport-quinn" }
hyper-serve = { path = "vendor/hyper-serve" }
